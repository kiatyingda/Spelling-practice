name: Tingxie
options:
  bundleIdPrefix: com.kiatyingda
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tingxie:
    type: application
    platform: iOS
    sources:
      - path: Tingxie
        excludes:
          - Info.plist
          - Resources/HanziWeb
          - Resources/HanziWeb/**
      # Bundled as a folder so index.html can load hanzi-writer.min.js by relative path.
      - path: Tingxie/Resources/HanziWeb
        type: folder
        buildPhase: resources
    info:
      path: Tingxie/Info.plist
      properties:
        CFBundleDisplayName: 听写
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the weekly 听写 sheet and the written answers.
        # From Config/Secrets.xcconfig (gitignored). Read via AppConfig.
        APP_TOKEN: $(APP_TOKEN)
        API_BASE_URL: $(API_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiatyingda.tingxie
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM comes from Config/Secrets.xcconfig so `xcodegen` never wipes it.
  TingxieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TingxieTests
    dependencies:
      - target: Tingxie
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  Tingxie:
    build:
      targets:
        Tingxie: all
        TingxieTests: [test]
    test:
      targets:
        - TingxieTests
